plugins {
    id 'com.android.application'
}

android {
    namespace 'lab.mtls'
    compileSdk 35

    defaultConfig {
        applicationId 'lab.mtls'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
        testInstrumentationRunner "lab.mtls.LabTestRunner"
    }
    signingConfigs {
        debug {
            // Gerada por scripts/prepare.sh e ignorada pelo Git.
            storeFile rootProject.file('../.local/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
