plugins {
    id 'com.android.application'
}

android {
    namespace 'lab.mtls.shared'
    compileSdk 35

    defaultConfig {
        applicationId 'lab.mtls.shared'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        debug {
            // Gerada por scripts/prepare.sh e ignorada pelo Git.
            storeFile rootProject.file('../.local/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    beforeVariants(selector().withBuildType("release")) { variant -> variant.enable = false }
}
