plugins { id 'com.android.application' }

android {
    namespace 'lab.mtls.embedded'
    compileSdk 35
    defaultConfig {
        applicationId 'lab.mtls.embedded'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
        testInstrumentationRunner 'lab.mtls.embedded.EmbeddedTestRunner'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('../.local/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    sourceSets {
        debug {
            assets.srcDir rootProject.file('../.local/generated-assets')
            res.srcDir rootProject.file('../.local/generated-res')
            java.srcDir rootProject.file('../.local/generated-java')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Não existe configuração DexGuard validada. Não produzir uma release supostamente protegida.
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant -> variant.enable = false }
}
tasks.register('verifyLocalInputs') {
    doLast {
        ['generated-assets/mtls/client.p12', 'generated-java/lab/mtls/embedded/GeneratedCredential.java',
         'generated-res/xml/network_security_config.xml'].each { path ->
            if (!rootProject.file('../.local/' + path).isFile()) {
                throw new GradleException('Execute scripts/prepare.sh; falta um input gerado localmente.')
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyLocalInputs' }
